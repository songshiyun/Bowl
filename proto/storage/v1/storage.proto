    (buf.validate.field).cel = {
      id: "diff_to_ref_not_dot"
      message: "branch name cannot be . or .."
      expression: "this != '.' && this != '..'"
    }
  ];
}

message DiffResponse {
  repeated DiffEntry entries = 1;
}
